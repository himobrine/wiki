<script>const POSTS = POSTS_DATA.map(function(p){return{title:p.title,date:p.date,url:'../'+p.url,excerpt:p.excerpt,tags:p.tags,primary:p.primary,secondary:p.secondary};});</script>
<script>
function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* === collect all tags === */
function getAllTags() {
  const map = {};
  POSTS.forEach(p => {
    p.tags.forEach(t => {
      if (!map[t]) map[t] = [];
      map[t].push(p);
    });
  });
  return map;
}

/* === render tag archive === */
function renderArchive(page) {
  const PER_PAGE = 10;
  const tagMap = getAllTags();
  const sortedTags = Object.keys(tagMap).sort();
  const totalPages = Math.ceil(sortedTags.length / PER_PAGE) || 1;
  page = Math.max(1, Math.min(page, totalPages));
  const start = (page - 1) * PER_PAGE;
  const pageTags = sortedTags.slice(start, start + PER_PAGE);

  let html = '<h2 class="section-title fade-up">// ALL // TAGS</h2>';
  html += '<div class="tag-grid">';
  pageTags.forEach(tag => {
    const posts = tagMap[tag];
    html += '<div class="tag-row" style="flex-direction:column;align-items:stretch;padding:12px;gap:4px;cursor:default">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center">';
    const tagColor = TAG_COLORS[tag];
    html += '<span style="color:' + (tagColor ? '#' + tagColor : 'var(--accent-cyan)') + ';font-size:13px">' + esc(tag) + '</span>';
    html += '<span style="color:var(--text-muted);font-size:12px">' + posts.length + ' 篇</span>';
    html += '</div>';
    posts.sort((a, b) => {
      const da = a.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
      const db = b.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
      return db.localeCompare(da);
    }).slice(0, 10).forEach(p => {
      html += '<a href="' + p.url + '" class="tag-post-link">' + p.title + '</a>';
    });
    if (posts.length > 10) {
      html += '<div style="font-size:11px;color:var(--text-muted);padding:2px 0">还有 ' + (posts.length - 10) + ' 篇...</div>';
    }
    html += '<a href="list.html?tag=' + encodeURIComponent(tag) + '" style="font-size:12px;color:var(--accent-cyan);text-decoration:none;margin-top:2px;display:inline-block">查看全部 &rarr;</a>';
    html += '</div>';
  });
  html += '</div>';

  if (totalPages > 1) {
    html += '<div class="pagination fade-up">';
    if (page > 1) {
      html += '<a href="list.html?page=' + (page - 1) + '" class="pagination-link">&larr; 上一页</a>';
    } else {
      html += '<span class="pagination-link pagination-disabled">&larr; 上一页</span>';
    }
    const range = 2;
    const pageNums = [];
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= page - range && i <= page + range)) {
        pageNums.push(i);
      } else if (pageNums[pageNums.length - 1] !== '...') {
        pageNums.push('...');
      }
    }
    pageNums.forEach(p => {
      if (p === '...') {
        html += '<span class="pagination-ellipsis">…</span>';
      } else if (p === page) {
        html += '<span class="pagination-link pagination-current">' + p + '</span>';
      } else {
        html += '<a href="list.html?page=' + p + '" class="pagination-link">' + p + '</a>';
      }
    });
    if (page < totalPages) {
      html += '<a href="list.html?page=' + (page + 1) + '" class="pagination-link">下一页 &rarr;</a>';
    } else {
      html += '<span class="pagination-link pagination-disabled">下一页 &rarr;</span>';
    }
    html += '</div>';
  }

  document.getElementById('contentArea').innerHTML = html;
}

/* === render tag filtered === */
function renderTag(tag, page) {
  const PER_PAGE = 10;
  let decoded; try { decoded = decodeURIComponent(tag); } catch { decoded = tag; }
  const filtered = POSTS.filter(p => p.tags.includes(decoded)).sort((a, b) => {
    const da = a.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
    const db = b.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
    return db.localeCompare(da);
  });
  const totalPages = Math.ceil(filtered.length / PER_PAGE) || 1;
  page = Math.max(1, Math.min(page, totalPages));
  const start = (page - 1) * PER_PAGE;
  const pagePosts = filtered.slice(start, start + PER_PAGE);

  document.getElementById('pageTitle').textContent = '// TAG : ' + decoded;
  document.getElementById('pageTagline').innerHTML = '&gt; 标签 <strong>' + esc(decoded) + '</strong> 共 ' + filtered.length + ' 篇文章' + (totalPages > 1 ? ' — 第 ' + page + ' / ' + totalPages + ' 页' : '') + ' <span class="cursor">▌</span>';

  let html = '<h2 class="section-title fade-up">// ' + decoded + ' // ' + filtered.length + ' POSTS</h2>';
  if (filtered.length === 0) {
    html += '<div class="post fade-up" style="text-align:center;padding:40px;color:var(--text-muted)">暂无该标签的文章</div>';
  } else {
    pagePosts.forEach(p => {
      html += '<div class="post fade-up">';
      html += '<div class="post-date">' + p.date + '</div>';
      html += '<div class="post-title"><a href="' + p.url + '">' + p.title + '</a></div>';
      html += '<div class="post-tags">';
      p.tags.forEach(t => {
        const c = TAG_COLORS[t] || '888888';
        html += '<a href="list.html?tag=' + encodeURIComponent(t) + '" class="post-tag" style="background:#' + c + '22;color:#' + c + ';border:1px solid #' + c + '44">' + esc(t) + '</a>';
      });
      html += '</div>';
      html += '<div class="post-excerpt">' + p.excerpt + '</div>';
      html += '<a href="' + p.url + '" class="read-more">[ + ] READ MORE &rarr;</a>';
      html += '</div>';
    });

    /* pagination */
    if (totalPages > 1) {
      html += '<div class="pagination fade-up">';

      if (page > 1) {
        html += '<a href="list.html?tag=' + encodeURIComponent(decoded) + '&page=' + (page - 1) + '" class="pagination-link">&larr; 上一页</a>';
      } else {
        html += '<span class="pagination-link pagination-disabled">&larr; 上一页</span>';
      }

      const range = 2;
      const pageNums = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= page - range && i <= page + range)) {
          pageNums.push(i);
        } else if (pageNums[pageNums.length - 1] !== '...') {
          pageNums.push('...');
        }
      }

      pageNums.forEach(p => {
        if (p === '...') {
          html += '<span class="pagination-ellipsis">…</span>';
        } else if (p === page) {
          html += '<span class="pagination-link pagination-current">' + p + '</span>';
        } else {
          html += '<a href="list.html?tag=' + encodeURIComponent(decoded) + '&page=' + p + '" class="pagination-link">' + p + '</a>';
        }
      });

      if (page < totalPages) {
        html += '<a href="list.html?tag=' + encodeURIComponent(decoded) + '&page=' + (page + 1) + '" class="pagination-link">下一页 &rarr;</a>';
      } else {
        html += '<span class="pagination-link pagination-disabled">下一页 &rarr;</span>';
      }

      html += '</div>';
    }
  }
  document.getElementById('contentArea').innerHTML = html;
}

/* === init === */
const params = new URLSearchParams(window.location.search);
const tag = params.get('tag');
const page = parseInt(params.get('page')) || 1;
if (tag) {
  renderTag(tag, page);
  // highlight nav
  document.querySelectorAll('.nav-inner a').forEach(a => {
    if (a.getAttribute('href') === 'list.html?tag=' + tag) a.classList.add('active');
  });
} else {
  renderArchive(page);
  document.querySelectorAll('.nav-inner a').forEach(a => {
    if (a.getAttribute('href') === 'list.html') a.classList.add('active');
  });
}

</script>

<script>
(function(){
var gs=document.getElementById('graphSidebar'),gc=document.getElementById('graphContainer');
if(!gs||!gc)return;
var obs=new IntersectionObserver(function(entries){
  if(!entries[0].isIntersecting)return;
  obs.disconnect();
  var s=document.createElement('script');
  s.src='../assets/vis-network.min.js';
  s.onload=function(){
    var g=document.createElement('script');
    g.src='../assets/graph.js';
    document.body.appendChild(g);
  };
  document.body.appendChild(s);
},{rootMargin:'200px'});
obs.observe(gs);
})();
</script>
