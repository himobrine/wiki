<script>const POSTS = POSTS_DATA.map(function(p){return{title:p.title,date:p.date,url:'../'+p.url,excerpt:p.excerpt,tags:p.tags,primary:p.primary,secondary:p.secondary};});</script>
<script>
function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getAllTags() {
  const map = {};
  POSTS.forEach(p => {
    getFlatTags(p).forEach(t => {
      if (!map[t]) map[t] = [];
      map[t].push(p);
    });
  });
  return map;
}

function renderArchive(page) {
  const PER_PAGE = 10;
  const tagMap = getAllTags();
  const sortedTags = Object.keys(tagMap).sort();
  const totalPages = Math.ceil(sortedTags.length / PER_PAGE) || 1;
  page = Math.max(1, Math.min(page, totalPages));
  const start = (page - 1) * PER_PAGE;
  const pageTags = sortedTags.slice(start, start + PER_PAGE);

  let html = '<section class="mk-section">';
  html += '<header class="mk-section-head fade-up"><h2>// ALL // TAGS</h2></header>';
  html += '<div class="mk-tag-index fade-up"><div class="mk-tag-grid">';
  pageTags.forEach(tag => {
    const posts = tagMap[tag];
    const tagColor = TAG_COLORS[tag];
    html += '<div class="mk-tag-row">';
    html += '<div class="mk-tag-row-header">';
    html += '<span class="mk-tag-row-name" style="color:' + (tagColor ? '#' + tagColor : 'var(--mk-gold)') + '">' + esc(tag) + '</span>';
    html += '<span class="mk-tag-row-count">' + posts.length + ' 篇</span>';
    html += '</div>';
    posts.sort((a, b) => {
      const da = a.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
      const db = b.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
      return db.localeCompare(da);
    }).slice(0, 10).forEach(p => {
      html += '<a href="' + p.url + '" class="mk-tag-post-link">' + p.title + '</a>';
    });
    if (posts.length > 10) {
      html += '<div style="font-size:11px;color:var(--mk-faint);padding:2px 0">还有 ' + (posts.length - 10) + ' 篇...</div>';
    }
    html += '<a href="list.html?tag=' + encodeURIComponent(tag) + '" style="font-size:12px;color:var(--mk-gold);text-decoration:none;margin-top:2px;display:inline-block">查看全部 &rarr;</a>';
    html += '</div>';
  });
  html += '</div></div></section>';

  if (totalPages > 1) {
    html += '<div class="mk-pagination fade-up">';
    if (page > 1) {
      html += '<a href="list.html?page=' + (page - 1) + '" class="mk-page-link">&larr; 上一页</a>';
    } else {
      html += '<span class="mk-page-link mk-page-disabled">&larr; 上一页</span>';
    }
    const range = 2;
    const pageNums = [];
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= page - range && i <= page + range)) {
        pageNums.push(i);
      } else if (pageNums[pageNums.length - 1] !== '...') {
        pageNums.push('...');
      }
    }
    pageNums.forEach(p => {
      if (p === '...') {
        html += '<span class="mk-page-ellipsis">…</span>';
      } else if (p === page) {
        html += '<span class="mk-page-link mk-page-current">' + p + '</span>';
      } else {
        html += '<a href="list.html?page=' + p + '" class="mk-page-link">' + p + '</a>';
      }
    });
    if (page < totalPages) {
      html += '<a href="list.html?page=' + (page + 1) + '" class="mk-page-link">下一页 &rarr;</a>';
    } else {
      html += '<span class="mk-page-link mk-page-disabled">下一页 &rarr;</span>';
    }
    html += '</div>';
  }

  document.getElementById('contentArea').innerHTML = html;
}

function renderTag(tag, page) {
  const PER_PAGE = 10;
  let decoded; try { decoded = decodeURIComponent(tag); } catch { decoded = tag; }
  const filtered = POSTS.filter(p => getFlatTags(p).includes(decoded)).sort((a, b) => {
    const da = a.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
    const db = b.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
    return db.localeCompare(da);
  });
  const totalPages = Math.ceil(filtered.length / PER_PAGE) || 1;
  page = Math.max(1, Math.min(page, totalPages));
  const start = (page - 1) * PER_PAGE;
  const pagePosts = filtered.slice(start, start + PER_PAGE);

  document.getElementById('pageTitle').textContent = '// TAG : ' + decoded;

  let html = '<section class="mk-section">';
  html += '<header class="mk-section-head fade-up"><h2>// ' + decoded + ' // ' + filtered.length + ' POSTS</h2></header>';
  if (filtered.length === 0) {
    html += '<div class="mk-bento-tile fade-up" style="text-align:center;padding:var(--mk-space-2xl);color:var(--mk-faint)">暂无该标签的文章</div>';
  } else {
    pagePosts.forEach(p => {
      html += '<article class="mk-bento-tile fade-up">';
      html += '<time class="mk-post-date">' + p.date + '</time>';
      html += '<h3 class="mk-post-title"><a href="' + p.url + '">' + p.title + '</a></h3>';
      html += '<div class="mk-post-tags">';
      getFlatTags(p).forEach(t => {
        const c = TAG_COLORS[t] || '888888';
        html += '<a href="list.html?tag=' + encodeURIComponent(t) + '" class="mk-tag" style="--tag-color:#' + c + '">#' + esc(t) + '</a>';
      });
      html += '</div>';
      html += '<p class="mk-post-excerpt">' + p.excerpt + '</p>';
      html += '<a href="' + p.url + '" class="mk-read-more">[ + ] READ MORE &rarr;</a>';
      html += '</article>';
    });

    if (totalPages > 1) {
      html += '<div class="mk-pagination fade-up">';
      if (page > 1) {
        html += '<a href="list.html?tag=' + encodeURIComponent(decoded) + '&page=' + (page - 1) + '" class="mk-page-link">&larr; 上一页</a>';
      } else {
        html += '<span class="mk-page-link mk-page-disabled">&larr; 上一页</span>';
      }
      const range = 2;
      const pageNums = [];
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= page - range && i <= page + range)) {
          pageNums.push(i);
        } else if (pageNums[pageNums.length - 1] !== '...') {
          pageNums.push('...');
        }
      }
      pageNums.forEach(p => {
        if (p === '...') {
          html += '<span class="mk-page-ellipsis">…</span>';
        } else if (p === page) {
          html += '<span class="mk-page-link mk-page-current">' + p + '</span>';
        } else {
          html += '<a href="list.html?tag=' + encodeURIComponent(decoded) + '&page=' + p + '" class="mk-page-link">' + p + '</a>';
        }
      });
      if (page < totalPages) {
        html += '<a href="list.html?tag=' + encodeURIComponent(decoded) + '&page=' + (page + 1) + '" class="mk-page-link">下一页 &rarr;</a>';
      } else {
        html += '<span class="mk-page-link mk-page-disabled">下一页 &rarr;</span>';
      }
      html += '</div>';
    }
  }
  html += '</section>';
  document.getElementById('contentArea').innerHTML = html;
}

const params = new URLSearchParams(window.location.search);
const tag = params.get('tag');
const pg = parseInt(params.get('page')) || 1;
if (tag) {
  renderTag(tag, pg);
  document.querySelectorAll('.mk-nav-link').forEach(a => {
    if (a.getAttribute('href') === 'list.html?tag=' + tag) a.classList.add('active');
  });
} else {
  renderArchive(pg);
  document.querySelectorAll('.mk-nav-link').forEach(a => {
    if (a.getAttribute('href') === 'list.html') a.classList.add('active');
  });
}
</script>
<script src="../assets/common.js"></script>

<aside class="mk-graph-sidebar" id="mkGraphSidebar" data-default-spoke>
  <div class="mk-graph-title"><a href="../graph.html">// 关系图谱</a></div>
  <div id="graphContainer"></div>
</aside>
<script>
(function(){
var gs=document.getElementById('mkGraphSidebar'),gc=document.getElementById('graphContainer');
if(!gs||!gc)return;
var obs=new IntersectionObserver(function(entries){
  if(!entries[0].isIntersecting)return;
  obs.disconnect();
  var s=document.createElement('script');
  s.src='../assets/vis-network.min.js';
  s.onload=function(){
    var g=document.createElement('script');
    g.src='../assets/graph.js';
    document.body.appendChild(g);
  };
  document.body.appendChild(s);
},{rootMargin:'200px'});
obs.observe(gs);
})();
</script>
