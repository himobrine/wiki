<script>const POSTS = POSTS_DATA;</script>
<script>
(function() {
  const sorted = [...POSTS].sort((a, b) => {
    const da = a.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
    const db = b.date.replace(/ \/\/ /g, '-').split(' / ').join('-');
    return db.localeCompare(da);
  });
  const top = sorted.slice(0, 12);
  let html = '';
  const spanClass = window.innerWidth >= 960 ? 'mk-bento-tile mk-bento-tile--span-4' : 'mk-bento-tile';
  top.forEach(p => {
    html += '<article class="' + spanClass + ' fade-up">';
    html += '<time class="mk-post-date">' + p.date + '</time>';
    html += '<h3 class="mk-post-title"><a href="' + p.url + '">' + p.title + '</a></h3>';
    html += '<div class="mk-post-tags">';
    p.tags.forEach(t => {
      const tc = TAG_COLORS[t] || '888888';
      html += '<a href="tags/list.html?tag=' + encodeURIComponent(t) + '" class="mk-tag" style="--tag-color:#' + tc + '">#' + t + '</a>';
    });
    html += '</div>';
    html += '<p class="mk-post-excerpt">' + p.excerpt + '</p>';
    html += '<a href="' + p.url + '" class="mk-read-more">[ + ] READ MORE &rarr;</a>';
    html += '</article>';
  });
  document.getElementById('latestPosts').innerHTML = html;
})();

(function() {
  const tagMap = {};
  POSTS.forEach(p => {
    p.tags.forEach(t => {
      if (!tagMap[t]) tagMap[t] = 0;
      tagMap[t]++;
    });
  });
  const sorted = Object.keys(tagMap).sort();
  let html = '<div class="mk-tag-grid">';
  sorted.forEach(t => {
    const tc = TAG_COLORS[t] || '888888';
    html += '<div class="mk-tag-row">';
    html += '<div class="mk-tag-row-header">';
    html += '<span class="mk-tag-row-name" style="color:#' + tc + '">#' + t + '</span>';
    html += '<span class="mk-tag-row-count">' + tagMap[t] + '</span>';
    html += '</div>';
    html += '<a href="tags/list.html?tag=' + encodeURIComponent(t) + '" class="mk-tag-post-link" style="color:#' + tc + '">查看全部 &rarr;</a>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('tagGrid').innerHTML = html;
})();
</script>
<script src="assets/common.js"></script>

<aside class="mk-graph-sidebar" id="mkGraphSidebar">
  <div class="mk-graph-title"><a href="graph.html">// 关系图谱</a></div>
  <div id="graphContainer"></div>
</aside>
<script>
(function(){
var gs=document.getElementById('mkGraphSidebar'),gc=document.getElementById('graphContainer');
if(!gs||!gc)return;
var obs=new IntersectionObserver(function(entries){
  if(!entries[0].isIntersecting)return;
  obs.disconnect();
  var s=document.createElement('script');
  s.src='assets/vis-network.min.js';
  s.onload=function(){
    var g=document.createElement('script');
    g.src='assets/graph.js';
    document.body.appendChild(g);
  };
  document.body.appendChild(s);
},{rootMargin:'200px'});
obs.observe(gs);
})();
</script>
